<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Argus: the site's motif. Replaces a purple lightning bolt left over from
       another project, and the crossed-swords emoji the page was actually
       using. Drawn to read at 16px: the iris is oversized relative to the eye
       on the page, because at tab size a correctly-proportioned pupil
       disappears. -->
  <rect width="100" height="100" rx="22" fill="#0A0708"/>
  <g>
    <path d="M 10 52 Q 50 16 90 52 Q 50 88 10 52 Z" fill="#F0EAE4"/>
    <circle cx="50" cy="52" r="20" fill="#FFC400"/>
    <circle cx="50" cy="52" r="8.5" fill="#0A0708"/>
  </g>
</svg>
