<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThyImpaler — Full-stack &amp; Smart Contract Engineer</title>
    <!-- Matches the wording on the page. The previous description promised
         "viral growth" and "24/7 anti-FUD", which appears nowhere on the site
         and is not how any of this work is described. -->
    <meta name="description" content="Full-stack and smart contract engineer. Head of development on Nest, an ERC-721 NFT launchpad live on Robinhood Chain — Solidity contracts, a Fastify and PostgreSQL backend with its own chain indexer, and the front end on top." />
    <meta name="theme-color" content="#0A0708" />
    <link rel="canonical" href="https://www.thyimpaler.xyz/" />
    <!-- The Argus eye, matching the site. Was a crossed-swords emoji rendered
         through a data URI, which had nothing to do with anything here. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph.
         `og:image` was missing, which is the whole reason shared links showed
         no preview: without it most platforms fall back to a bare URL. The URL
         must be absolute — relative paths are not resolved by crawlers. -->
    <meta property="og:title" content="ThyImpaler — Full-stack &amp; Smart Contract Engineer" />
    <meta property="og:description" content="I build the on-chain infrastructure other people launch on — ERC-721 factories, the indexers that keep them honest, and the front ends that make them usable. Head of development on Nest, live on Robinhood Chain." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.thyimpaler.xyz/" />
    <meta property="og:site_name" content="ThyImpaler" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://www.thyimpaler.xyz/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ThyImpaler — Built to hold under pressure. Full-stack and smart contract engineer." />

    <!-- Twitter/X reads its own namespace and ignores og:* for card type.
         summary_large_image is what produces the full-width preview. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ThyImpaler — Full-stack &amp; Smart Contract Engineer" />
    <meta name="twitter:description" content="ERC-721 factories, the indexers that keep them honest, and the front ends that make them usable. Head of development on Nest, live on Robinhood Chain." />
    <meta name="twitter:image" content="https://www.thyimpaler.xyz/og.png" />
    <meta name="twitter:image:alt" content="ThyImpaler — Built to hold under pressure." />

    <!-- Structured data. Without it Google has to infer the entity from the
         prose, which is how a site ends up titled with a bare domain and a
         guessed capitalisation. `name` states the spelling explicitly, and
         `sameAs` ties the handles on the page to the same person rather than
         leaving four unrelated profiles.

         Everything here is asserted on the page too. Schema that claims more
         than the page shows is worse than none: it is the kind of thing that
         gets structured data ignored site-wide. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://www.thyimpaler.xyz/#person",
            "name": "ThyImpaler",
            "url": "https://www.thyimpaler.xyz/",
            "image": "https://www.thyimpaler.xyz/avatar.jpg",
            "jobTitle": "Head of Development and Smart Contract Engineer",
            "description": "Full-stack and smart contract engineer. Head of development on Nest, an ERC-721 NFT launchpad live on Robinhood Chain — Solidity contracts, a Fastify and PostgreSQL backend with its own chain indexer, and the front end on top.",
            "knowsAbout": [
              "Solidity",
              "Smart contract development",
              "ERC-721",
              "TypeScript",
              "Node.js",
              "PostgreSQL",
              "Web3 security",
              "Ethereum",
              "Solana"
            ],
            "sameAs": [
              "https://t.me/ThyImpaler",
              "https://x.com/Thy_Impaler",
              "https://github.com/thyimpaler"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.thyimpaler.xyz/#website",
            "url": "https://www.thyimpaler.xyz/",
            "name": "ThyImpaler",
            "inLanguage": "en",
            "publisher": { "@id": "https://www.thyimpaler.xyz/#person" }
          },
          {
            "@type": "ProfilePage",
            "@id": "https://www.thyimpaler.xyz/#page",
            "url": "https://www.thyimpaler.xyz/",
            "name": "ThyImpaler — Full-stack & Smart Contract Engineer",
            "isPartOf": { "@id": "https://www.thyimpaler.xyz/#website" },
            "about": { "@id": "https://www.thyimpaler.xyz/#person" },
            "primaryImageOfPage": "https://www.thyimpaler.xyz/og.png"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
